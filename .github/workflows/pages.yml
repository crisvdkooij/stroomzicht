# Zet het prototype en de filmpagina op GitHub Pages.
# Publiceert alleen index.html, film.html en de film zelf, niet de rest van de repo.
# Draait bij elke push naar de standaardbranch, of met de hand via 'Run workflow'.
name: Publiceer op GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publiceer:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pagina's bouwen
        run: node build.mjs

      - name: Website samenstellen
        run: |
          mkdir -p _site/promo
          cp index.html film.html _site/
          cp promo/capaciteitskaart-promo.mp4 promo/poster.jpg _site/promo/
          ls -lR _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
